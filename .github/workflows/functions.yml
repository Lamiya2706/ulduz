name: Deploy edge functions

# Deploys the listed Supabase Edge Functions when their code changes on main (or by hand from the Actions tab).
# Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
# Only the functions in FUNCTIONS are deployed, so the payment functions stay off until they are added here.

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "src/content/**", "src/lib/date.ts", "supabase/config.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sjxvmmcsrqdzuapfktnh
      FUNCTIONS: telegram-bot telegram-daily
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first"; exit 1; fi
          supabase functions deploy $FUNCTIONS --project-ref "$PROJECT_REF" --use-api --yes
