name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Served from the custom domain ulduz.space, so the app lives at the root.
          VITE_BASE: /
          # Optional until the backend exists: add these under Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # The Telegram bot's username (without @) for "Connect Telegram" on the account page — optional
          VITE_TELEGRAM_BOT: ${{ vars.VITE_TELEGRAM_BOT }}
          # Google Analytics 4 measurement ID (G-XXXXXXX) and Search Console HTML-tag token — optional
          VITE_GA_ID: ${{ vars.GA_ID || 'G-E424P74CK6' }}
          VITE_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
      - name: SPA fallback (deep links like /az/chart/… load the app)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
