# Supabase CLI config (only the parts Ulduz needs).
project_id = "ulduz"

[functions.create-payment]
verify_jwt = false
[functions.epoint-callback]
verify_jwt = false   # Epoint posts here directly; requests are authenticated by Epoint's signature instead
[functions.check-status]
verify_jwt = false
[functions.get-order]
verify_jwt = false
[functions.generate-reading]
verify_jwt = false
[functions.ask-question]
verify_jwt = false
[functions.daily-push]
verify_jwt = false   # called by pg_cron; authenticated with the PUSH_CRON_SECRET header instead
[functions.send-reminders]
verify_jwt = false   # called by pg_cron; checked against a secret kept in the database
[functions.unsubscribe]
verify_jwt = false   # one-click unsubscribe from mail apps; needs the private token
[functions.telegram-bot]
verify_jwt = false   # Telegram posts here; requests are checked against the webhook secret token instead
[functions.telegram-daily]
verify_jwt = false   # called by pg_cron; requests are checked against a secret kept in Vault
